<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Aura Player default cover</title>
  <desc id="desc">A dark purple gradient album cover with an abstract glowing music symbol</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17132c"/>
      <stop offset="0.55" stop-color="#31245b"/>
      <stop offset="1" stop-color="#5b2f63"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0" stop-color="#b06cff" stop-opacity="0.95"/>
      <stop offset="0.48" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="800" height="800" rx="96" fill="url(#bg)"/>
  <circle cx="400" cy="360" r="250" fill="url(#glow)" filter="url(#blur)"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M340 540V270c0-24 19-43 43-43h82" stroke-width="34" opacity="0.95"/>
    <path d="M465 227v228" stroke-width="34" opacity="0.95"/>
    <path d="M340 342l125-44" stroke="#b9a5ff" stroke-width="28"/>
  </g>
  <circle cx="315" cy="565" r="58" fill="#fff"/>
  <circle cx="440" cy="500" r="58" fill="#e8e2ff"/>
</svg>
